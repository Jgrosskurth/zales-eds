<!--
  ZALES EDS — head.html
  Additional <head> elements injected into every page.
  EDS merges this file into the <head> at build/runtime.
-->

<!-- Preconnect to font CDN -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<!-- Cormorant Garamond — Display font -->
<link
  rel="preload"
  href="https://fonts.gstatic.com/s/cormorantgaramond/v16/co3bmX5slCNuHLi8bLeY9MK7whWMhyjorn4.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>

<!-- Favicon -->
<link rel="icon" href="/icons/favicon.ico" sizes="any"/>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>

<!-- Theme color (announcement bar color) -->
<meta name="theme-color" content="#2A1750"/>

<!-- Open Graph defaults (overridden per page) -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Zales"/>
<meta property="og:locale" content="en_US"/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:site" content="@Zales"/>

<!-- Structured Data — Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "JewelryStore",
  "name": "Zales",
  "alternateName": "Zales Jewelers",
  "url": "https://www.zales.com",
  "logo": "https://www.zales.com/icons/zales-logo.svg",
  "description": "America's Diamond Store Since 1924. Fine jewelry for every love story.",
  "sameAs": [
    "https://www.facebook.com/zales",
    "https://www.instagram.com/zalesjewelry",
    "https://www.pinterest.com/zalesjewelry",
    "https://www.youtube.com/zales",
    "https://www.tiktok.com/@zales"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "1-800-311-5393",
    "contactType": "customer service"
  }
}
</script>

<!-- Fonts CSS (loaded early for LCP) -->
<link rel="stylesheet" href="/styles/fonts.css"/>
